<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Resolve the colour scheme before the first paint. Without this, a
		     visitor who has chosen dark gets one frame of the light page, because
		     the saved choice lives in localStorage and nothing server-side knows
		     it. Kept inline and dependency-free for that reason. -->
		<script>
			(() => {
				try {
					const saved = localStorage.getItem('theme');
					const dark = saved
						? saved === 'dark'
						: window.matchMedia('(prefers-color-scheme: dark)').matches;
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				} catch {
					document.documentElement.dataset.theme = 'light';
				}
			})();
		</script>

		<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
